<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>

   <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <style>
        h1 {
      font-family: 'Bungee', sans-serif;
      color: red;
      font-size: 60px;
      text-align: center;
    }
    .random-link {
      position: fixed;
      top: 10%;
      left: 10%;
      z-index: 9999;
      animation: moveRandomly 10s infinite alternate ease-in-out;
    }

    .random-link img {
      width: 100px;
      height: auto;
      display: block;
    }

    @keyframes moveRandomly {
      0%   { top: 10%; left: 10%; }
      20%  { top: 70%; left: 80%; }
      40%  { top: 20%; left: 65%; }
      60%  { top: 80%; left: 15%; }
      80%  { top: 40%; left: 45%; }
      100% { top: 15%; left: 75%; }
    }
  </style>
</head>
<body>
  <h1 style="color: red; font-size: 60px; text-align: center;">CLICK THIS CAT</h1>
  <div class="image">
    <a href="https://www.youtube.com/watch?v=oeDQ4sdfsG4" class="random-link" target="_blank">
      <img src="https://codehs.com/uploads/ab339ca882e256c27b64b7e36546f7a8" alt="Moving Kitten">
    </a>
  </div>
</body>
</html>
