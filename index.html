<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    .random-link {
      position: fixed;
      top: 10%;
      left: 10%;
      z-index: 9999;
      animation: moveRandomly 10s infinite alternate ease-in-out;
    }

    .random-link img {
      width: 100px;
      height: auto;
      display: block;
    }

    @keyframes moveRandomly {
      0%   { top: 10%; left: 10%; }
      20%  { top: 70%; left: 80%; }
      40%  { top: 20%; left: 65%; }
      60%  { top: 80%; left: 15%; }
      80%  { top: 40%; left: 45%; }
      100% { top: 15%; left: 75%; }
    }
  </style>
</head>
<body>
  <div class="image">
    <a href="https://youtube.com" class="random-link" target="_blank">
      <img src="https://codehs.com" alt="Moving Kitten">
    </a>
  </div>
</body>
</html>
